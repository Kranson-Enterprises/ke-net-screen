# METABEGIN
# X-Env-Layer-Name: ke-00-layer
# X-Env-Layer-Desc: Kranson Enterprise Layer description
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Category: general
# X-Env-Layer-Requires: systemd-net-min,ke-unbsrccfg,ke-unbcfg,ke-piholecfg,ke-avhicfg,ke-monitor
#
# X-Env-VarPrefix: ke
#
# X-Env-VarRequires: IGconf_device_user1
# X-Env-VarRequires-Valid: string
#
# X-Env-VarOptional: IGconf_device_user1pass,LOG_LEVEL,IGconf_ke_pihole_password
# X-Env-VarOptional-Valid: string,string,string
#
# X-Env-Var-pihole_regex_deny:
# X-Env-Var-pihole_regex_deny-Desc: Semicolon-separated Pi-hole regex deny entries
#  imported into gravity.db at first boot (ke-piholecfg). Example: ^wpad\. stops
#  Web Proxy Auto-Discovery lookups leaving the LAN. Empty (the default) imports
#  nothing. Set from .env as PIHOLE_REGEX_DENY via config/ke-net-screen.yaml. The
#  appliance helper wpad-block.sh toggles the WPAD entry at run time.
# X-Env-Var-pihole_regex_deny-Required: n
# X-Env-Var-pihole_regex_deny-Valid: string-or-empty
# X-Env-Var-pihole_regex_deny-Set: y
#
# X-Env-Var-dot_terminator:
# X-Env-Var-dot_terminator-Desc: y installs a DNS-over-TLS terminator (stunnel) on
#  port 853 in front of FTL, using the certificate FTL self-generates at first boot.
#  Android's default "Automatic" Private DNS probes the network resolver's port 853
#  and upgrades to encrypted DNS opportunistically (no hostname validation), so
#  default-mode phones get encrypted transport with filtering intact and zero
#  per-device setup. n (the default) installs nothing and leaves behavior unchanged.
#  Set from .env as DOT_TERMINATOR via config/ke-net-screen.yaml.
# X-Env-Var-dot_terminator-Required: n
# X-Env-Var-dot_terminator-Valid: string-or-empty
# X-Env-Var-dot_terminator-Set: y
#
# X-Env-Var-dot_tls_hardening:
# X-Env-Var-dot_tls_hardening-Desc: y hardens the DoT terminator's TLS (ke-piholecfg):
#  key exchange offers the ML-KEM-768 + X25519 hybrid first, TLS 1.2 is AEAD-only.
#  Only with dot_terminator=y. n (the default) leaves dot.conf unchanged.
#  Set from .env as DOT_TLS_HARDENING via config/ke-net-screen.yaml.
# X-Env-Var-dot_tls_hardening-Required: n
# X-Env-Var-dot_tls_hardening-Valid: string-or-empty
# X-Env-Var-dot_tls_hardening-Set: y
#
# X-Env-Var-unbound_incoming_num_tcp:
# X-Env-Var-unbound_incoming_num_tcp-Desc: Unbound incoming-num-tcp (ke-unbcfg), an
#  integer 1-40; the hook refuses anything else. 10 (Unbound's default) writes
#  nothing; another value writes etc/unbound/unbound.conf.d/ke-incoming-tcp.conf.
#  Set from .env as UNBOUND_INCOMING_NUM_TCP via config/ke-net-screen.yaml.
# X-Env-Var-unbound_incoming_num_tcp-Required: n
# X-Env-Var-unbound_incoming_num_tcp-Valid: string-or-empty
# X-Env-Var-unbound_incoming_num_tcp-Set: y
#
# X-Env-Var-sysctl_hardening:
# X-Env-Var-sysctl_hardening-Desc: y installs two optional sysctl files (ke-knlcfg):
#  60-net-observe.conf (refuse and never send ICMP redirects, strict reverse-path
#  filter, log martian packets) and 61-kernel-harden.conf (kptr_restrict,
#  dmesg_restrict). n (the default) installs neither and leaves behavior unchanged.
#  Set from .env as SYSCTL_HARDENING via config/ke-net-screen.yaml.
# X-Env-Var-sysctl_hardening-Required: n
# X-Env-Var-sysctl_hardening-Valid: string-or-empty
# X-Env-Var-sysctl_hardening-Set: y
#
# X-Env-Var-sysctl_no_tiocsti:
# X-Env-Var-sysctl_no_tiocsti-Desc: y installs 62-ke-no-tiocsti.conf (ke-knlcfg):
#  dev.tty.legacy_tiocsti = 0, no keystroke injection into another terminal.
#  n (the default) installs nothing. Set from .env as SYSCTL_NO_TIOCSTI.
# X-Env-Var-sysctl_no_tiocsti-Required: n
# X-Env-Var-sysctl_no_tiocsti-Valid: string-or-empty
# X-Env-Var-sysctl_no_tiocsti-Set: y
#
# X-Env-Var-sysctl_no_ldisc_autoload:
# X-Env-Var-sysctl_no_ldisc_autoload-Desc: y installs 63-ke-no-ldisc-autoload.conf
#  (ke-knlcfg): dev.tty.ldisc_autoload = 0, users cannot trigger tty line-discipline
#  module loads. n (the default) installs nothing. Set from .env as
#  SYSCTL_NO_LDISC_AUTOLOAD.
# X-Env-Var-sysctl_no_ldisc_autoload-Required: n
# X-Env-Var-sysctl_no_ldisc_autoload-Valid: string-or-empty
# X-Env-Var-sysctl_no_ldisc_autoload-Set: y
#
# X-Env-Var-sysctl_no_io_uring:
# X-Env-Var-sysctl_no_io_uring-Desc: y installs 64-ke-no-io-uring.conf (ke-knlcfg):
#  kernel.io_uring_disabled = 2, io_uring refused for every process. n (the default)
#  installs nothing. Set from .env as SYSCTL_NO_IO_URING.
# X-Env-Var-sysctl_no_io_uring-Required: n
# X-Env-Var-sysctl_no_io_uring-Valid: string-or-empty
# X-Env-Var-sysctl_no_io_uring-Set: y
# METAEND
mmdebstrap:
  suite: trixie
  variant: minbase
  packages:
    - vim-tiny
  dpkgopts:
    - path-exclude=/usr/share/man/*
    - path-exclude=/usr/share/locale/*
    - path-include=/usr/share/locale/locale.alias
    - path-exclude=/usr/share/doc/*
    - path-include=/usr/share/doc/*/copyright
    - path-exclude=/usr/share/info/*
    - path-exclude=/usr/share/omf/*
    - path-exclude=/usr/share/help/*
    - path-exclude=/usr/share/gnome/help/*
    - path-exclude=/usr/share/lintian/*
    - path-exclude=/usr/share/doc/linux-image-*/changelog*
  customize-hooks:
    - |
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      chroot "$1" mkdir -p "/usr/local/bin"

      # Send in utility scripts
      cp "$REPO_ROOT/home/scripts/unbound/"* "$1/usr/local/bin/"
      chmod 755 "$1/usr/local/bin/"*
      uchroot "$1" 'ln -s /usr/local/bin/ /home/$IGconf_device_user1/scripts'
      uchroot "$1" 'ln -s /usr/local/bin/unbound-readme.txt /home/$IGconf_device_user1/unbound-readme.txt'
    - |
      # Install SSH hardening policy from repository template.
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      SSH_LISTEN_ADDRESS=${IGconf_network_ipaddress:?IGconf_network_ipaddress is required}

      install -d -m 0755 "$1/etc/ssh/sshd_config.d"
      cp -a "$REPO_ROOT/etc/ssh/sshd_config.d/local_network_only.conf" "$1/etc/ssh/sshd_config.d/local_network_only.conf"
      sed -i \
        -e "s/IGconf_network_ipaddress/$SSH_LISTEN_ADDRESS/g" \
        "$1/etc/ssh/sshd_config.d/local_network_only.conf"
      chmod 0644 "$1/etc/ssh/sshd_config.d/local_network_only.conf"
  cleanup-hooks:
    - rm -rf "$1"/var/lib/apt/lists/* || true
