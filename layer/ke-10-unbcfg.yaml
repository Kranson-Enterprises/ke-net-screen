# METABEGIN
# X-Env-Layer-Name: ke-unbcfg
# X-Env-Layer-Desc: Unbound Configuration
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Category: networking
# X-Env-Layer-Requires: ke-knlcfg,ke-netcfg
# X-Env-VarRequires: IGconf_device_user1,IGconf_network_ipaddress,IGconf_network_domain,IGconf_network_ipnetmask,IGconf_network_gateway,IGconf_network_dns0,IGconf_network_dns1,IGconf_network_dns2
# METAEND
mmdebstrap:
  suite: trixie
  variant: minbase
  packages:
    - unbound
    - dns-root-data
#    - dnsutils    
  customize-hooks:
    - |
      # Create unbound default for environment values
      install -d -m 0755 "$1/etc/default"
      echo 'DAEMON_OPTS=""' > "$1/etc/default/unbound" 2>/dev/null || true
    - |
      # Mask unbound-resolvconf.service at build time: resolved DNS is
      # configured explicitly via resolved.conf.d/unbound.conf, and the
      # helper's attempt to register unbound on the loopback interface is
      # rejected by systemd-resolved ("Link lo is loopback device"),
      # which otherwise leaves a failed unit on first boot.
      install -d -m 0755 "$1/etc/systemd/system"
      ln -sf /dev/null "$1/etc/systemd/system/unbound-resolvconf.service"
    - |
      # Prevent systemd-resolved dns stub listener from interfering with unbound on port 53.
      install -d -m 0755 "$1/etc/systemd/resolved.conf.d/"

      # Set up network configuration based on environment variables
      IP_ADDRESS=${IGconf_network_ipaddress:?IGconf_network_ipaddress is required}
      NETMASK=${IGconf_network_ipnetmask:-24}
      GATEWAY=${IGconf_network_gateway:-192.168.0.1}
      DNS0=${IGconf_network_dns0:-127.0.0.1}
      DNS1=${IGconf_network_dns1:?IGconf_network_dns1 is required}
      DNS2=${IGconf_network_dns2:?IGconf_network_dns2 is required}
      DOMAIN=${IGconf_network_domain:-lan}

      cat > "$1/etc/systemd/resolved.conf.d/unbound.conf" <<-EOR
      [Resolve]
      DNS=$DNS0
      DNSSEC=yes
      DNSStubListener=no
      # Delegated to Pi-Hole or other local resolver
      Cache=no
      # Disable link-local name resolution
      LLMNR=no
      # Avahi daemon handles mDNS
      MulticastDNS=no
      # Fallback DNS servers from config
      FallbackDNS=$DNS1 $DNS2
      EOR

      # Remove package-default example lines containing old fallback DNS literals.
      if [ -f "$1/etc/systemd/resolved.conf" ]; then
        sed -i '/8\.8\.8\.8/d; /9\.9\.9\.9/d' "$1/etc/systemd/resolved.conf"
      fi
    - |
      # Install Unbound config from repository as single source of truth.
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      install -d -m 0755 "$1/etc/unbound/unbound.conf.d/"
      cp -a "$REPO_ROOT/etc/unbound/unbound.conf.d/pi-hole.conf" "$1/etc/unbound/unbound.conf.d/pi-hole.conf"
      # Persistent observability (hourly stats blocks + DNSSEC-failure logging);
      # same hook item so REPO_ROOT is in scope (hook-split lesson).
      cp -a "$REPO_ROOT/etc/unbound/unbound.conf.d/ke-observability.conf" "$1/etc/unbound/unbound.conf.d/ke-observability.conf"
      # Incoming TCP buffers (UNBOUND_INCOMING_NUM_TCP, IGconf_ke_unbound_incoming_num_tcp):
      # Pi-hole FTL forwards over TCP too, and with unbound's default of 10 a burst of more
      # than 5 connections makes unbound shorten its idle timeout and close connections FTL
      # is about to reuse (FTL then logs CONNECTION_ERROR and may answer REFUSED, EDE 23).
      # 40 removed both on the appliance (live trial 2026-11-18..21). Range 1-40: this
      # unbound uses the built-in event loop (1,024 fds) and needs N + 984 with
      # outgoing-range 960, so above 40 it would cut outgoing-range. 10 (the default)
      # writes nothing, leaving the image exactly as before.
      N=${IGconf_ke_unbound_incoming_num_tcp:-10}
      case "$N" in
        ''|*[!0-9]*) echo "ke-unbcfg: UNBOUND_INCOMING_NUM_TCP must be an integer 1-40 (got '$N')" >&2; exit 1 ;;
      esac
      if [ "$N" -lt 1 ] || [ "$N" -gt 40 ]; then
        echo "ke-unbcfg: UNBOUND_INCOMING_NUM_TCP=$N is outside 1-40 (fd budget: N + 984 <= 1024)" >&2; exit 1
      fi
      if [ "$N" -ne 10 ]; then
        printf '%s\n' "# Written at build time from UNBOUND_INCOMING_NUM_TCP (layer/ke-10-unbcfg.yaml)." \
          "server:" "    incoming-num-tcp: $N" > "$1/etc/unbound/unbound.conf.d/ke-incoming-tcp.conf"
        chmod 0644 "$1/etc/unbound/unbound.conf.d/ke-incoming-tcp.conf"
        echo "ke-unbcfg: incoming-num-tcp $N (ke-incoming-tcp.conf)"
      else
        echo "ke-unbcfg: incoming-num-tcp left at unbound's default (10)"
      fi
