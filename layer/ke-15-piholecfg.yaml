# METABEGIN
# X-Env-Layer-Name: ke-piholecfg
# X-Env-Layer-Desc: Kranson Enterprise Pihole Layer Configuration
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Category: general
# X-Env-Layer-Requires: ke-unbcfg
# METAEND
mmdebstrap:
  suite: trixie
  variant: minbase
  setup-hooks:
    - |
      # Set up a first-boot script to run the Pi-hole installer on first boot
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      install -d -m 0755 "$1/usr/local/sbin" "$1/usr/local/src/pihole-installer"
      install -d -m 0755 "$1/boot/firmware/ke-secrets"

      # Persist the initial Pi-hole password to the boot partition for one-time
      # first-boot use. Read it from IGconf (the sanctioned hook channel):
      # rpi-image-gen >= v2.8.0-28 strips ambient env vars from hooks, which
      # silently emptied the old ${PIHOLE_PASSWORD} reference and shipped an
      # image whose first boot disabled the web password (observed 2026-09-06).
      KE_PIHOLE_PW="${IGconf_ke_pihole_password:-${PIHOLE_PASSWORD:-}}"
      if [ -n "$KE_PIHOLE_PW" ]; then
        printf '%s\n' "$KE_PIHOLE_PW" > "$1/boot/firmware/ke-secrets/pihole-admin-password.txt"
      else
        echo "WARNING: ke-piholecfg: no Pi-hole password available to stage; first boot will disable the web password" >&2
      fi
    - |
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      # Regex deny entries for first boot: IGconf_ke_pihole_regex_deny (PIHOLE_REGEX_DENY in
      # .env, semicolon-separated, empty by default) -> one pattern per line for the importer.
      install -d -m 0755 "$1/usr/local/src/pihole"
      : > "$1/usr/local/src/pihole/regex_deny.txt"
      if [ -n "${IGconf_ke_pihole_regex_deny:-}" ]; then
        printf '%s\n' "${IGconf_ke_pihole_regex_deny}" | tr ';' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' > "$1/usr/local/src/pihole/regex_deny.txt" || true
        echo "ke-piholecfg: staged $(grep -c . "$1/usr/local/src/pihole/regex_deny.txt") regex deny pattern(s) for first boot"
      fi

      DNS2=${IGconf_network_dns2:?IGconf_network_dns2 is required}

      # Add local copy of pi-hole installer script
      # The installer is the one thing first boot cannot do without: fail the build if it is missing.
      cp -a "$REPO_ROOT/vendors/pi-hole/automated install/basic-install.sh" "$1/usr/local/src/pihole-installer/" \
        || { echo "ERROR: ke-piholecfg: Pi-hole installer not found at $REPO_ROOT/vendors/pi-hole/automated install/basic-install.sh (submodule checked out?)" >&2; exit 1; }
      # Keep vendor DNS1 behavior intact and only replace DNS2 to avoid over-constraining upstream fallback.
      sed -i "s/9\.9\.9\.9/$DNS2/g" "$1/usr/local/src/pihole-installer/basic-install.sh" 2>/dev/null || true
      chmod +x "$1/usr/local/src/pihole-installer/basic-install.sh"

      # Create first-boot script to run pi-hole installer
      cat > "$1/usr/local/sbin/run-pihole-firstboot.sh" <<'EOS'
      #!/bin/sh
      set -e
      /usr/local/src/pihole-installer/basic-install.sh --unattended &
      wait $!
      sleep 2
      # disable this service so it doesn't run again
      rm -f /etc/systemd/system/multi-user.target.wants/run-pihole-firstboot.service || true
      # unbound-resolvconf.service is masked at image build time (ke-10);
      # no runtime disable is needed here.
      systemctl daemon-reload || true
      sleep 2
      systemctl restart systemd-resolved || true
      sleep 2
      systemctl reset-failed || true
      # Read the one-time password from the boot partition, then remove it.
      PIHOLE_PASSWORD_FILE="/boot/firmware/ke-secrets/pihole-admin-password.txt"
      if [ -f "$PIHOLE_PASSWORD_FILE" ]; then
        PIHOLE_PASSWORD_VALUE="$(tr -d '\r\n' < "$PIHOLE_PASSWORD_FILE")"
        if [ -n "$PIHOLE_PASSWORD_VALUE" ]; then
          pihole setpassword "$PIHOLE_PASSWORD_VALUE" || true
        else
          echo "WARN: Pi-hole password file is empty; disabling Pi-hole web password"
          pihole setpassword "" || true
        fi
        rm -f "$PIHOLE_PASSWORD_FILE" || true
        rmdir /boot/firmware/ke-secrets 2>/dev/null || true
      else
        echo "WARN: Pi-hole password file is missing; disabling Pi-hole web password"
        pihole setpassword "" || true
      fi
      python3 /usr/local/src/pihole/import_adlists.py || true
      python3 /usr/local/src/pihole/import_regex_deny.py || true
      pihole restartdns reload-lists || true
      pihole -g || true
      # networkflush removed: on a fresh install the network table is empty,
      # and the FTL API is not reliably up this early (observed first-boot
      # "API not available" failures).
      systemctl restart ssh
      EOS
      chmod +x "$1/usr/local/sbin/run-pihole-firstboot.sh"

      # Create systemd service to run the first-boot script
      install -d -m 0755 "$1/etc/systemd/system"
      cat > "$1/etc/systemd/system/run-pihole-firstboot.service" <<'EOSVC'
      [Unit]
      Description=Run Pi-hole installer on first boot
      After=systemd-time-wait-sync.service
      Requires=systemd-time-wait-sync.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/run-pihole-firstboot.sh
      AmbientCapabilities=CAP_NET_BIND_SERVICE CAP_NET_RAW

      [Install]
      WantedBy=multi-user.target
      EOSVC

      # enable the service
      install -d -m 0755 "$1/etc/systemd/system/multi-user.target.wants"
      ln -sf "/etc/systemd/system/run-pihole-firstboot.service" "$1/etc/systemd/system/multi-user.target.wants/run-pihole-firstboot.service"
    - |
      # Weekly blocklist refresh. The unattended Pi-hole installer does not
      # reliably create /etc/cron.d/pihole (observed: zero gravity updates
      # in 12 days on a deployed host), so ship a systemd timer instead.
      install -d -m 0755 "$1/etc/systemd/system"
      cat > "$1/etc/systemd/system/pihole-gravity.service" <<'EOGSVC'
      [Unit]
      Description=Update Pi-hole blocklists (gravity)
      Wants=network-online.target
      After=network-online.target pihole-FTL.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/pihole updateGravity
      Nice=10
      IOSchedulingClass=idle
      EOGSVC

      cat > "$1/etc/systemd/system/pihole-gravity.timer" <<'EOGTMR'
      [Unit]
      Description=Weekly Pi-hole blocklist refresh

      [Timer]
      OnCalendar=Sun *-*-* 03:00:00
      RandomizedDelaySec=4h
      Persistent=true

      [Install]
      WantedBy=timers.target
      EOGTMR

      install -d -m 0755 "$1/etc/systemd/system/timers.target.wants"
      ln -sf "/etc/systemd/system/pihole-gravity.timer" "$1/etc/systemd/system/timers.target.wants/pihole-gravity.timer"
    - |
      # Daily Pi-hole query-log rotation. Upstream schedules this through
      # /etc/cron.d/pihole, which the unattended installer does not reliably
      # create (observed: zero cron activity in 12 days, pihole.log growing
      # unbounded). Mirrors the upstream cron line, which drives Pi-hole's
      # own logrotate config; the logrotate binary is an installer dependency.
      install -d -m 0755 "$1/etc/systemd/system"
      cat > "$1/etc/systemd/system/pihole-logflush.service" <<'EOLFSVC'
      [Unit]
      Description=Rotate Pi-hole query logs (pihole flush)
      After=pihole-FTL.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/pihole flush once quiet
      Nice=10
      IOSchedulingClass=idle
      EOLFSVC

      cat > "$1/etc/systemd/system/pihole-logflush.timer" <<'EOLFTMR'
      [Unit]
      Description=Daily Pi-hole log rotation

      [Timer]
      OnCalendar=*-*-* 00:10:00
      RandomizedDelaySec=30min
      Persistent=true

      [Install]
      WantedBy=timers.target
      EOLFTMR

      install -d -m 0755 "$1/etc/systemd/system/timers.target.wants"
      ln -sf "/etc/systemd/system/pihole-logflush.timer" "$1/etc/systemd/system/timers.target.wants/pihole-logflush.timer"
    - |
      # pihole-FTL can need more than 60s to flush its long-term database on
      # stop, and a SIGKILL there risks DB corruption (observed 2026-09-02
      # during maintenance).  The unit itself is created by the installer at
      # first boot; this drop-in applies as soon as the unit exists.
      install -d -m 0755 "$1/etc/systemd/system/pihole-FTL.service.d"
      cat > "$1/etc/systemd/system/pihole-FTL.service.d/override.conf" <<'EOFTL'
      [Service]
      TimeoutStopSec=180
      EOFTL
    - |
      # Copy local pi-hole adlist import script and default adlist CSV
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      install -d -m 0755 "$1/usr/local/src/pihole/"
      cp -a "$REPO_ROOT/home/scripts/pihole/adlists_export.csv" "$1/usr/local/src/pihole/" 2>/dev/null || true
      cp -a "$REPO_ROOT/home/scripts/pihole/import_adlists.py" "$1/usr/local/src/pihole/" 2>/dev/null || true
      chmod +x "$1/usr/local/src/pihole/import_adlists.py"
      cp -a "$REPO_ROOT/home/scripts/pihole/import_regex_deny.py" "$1/usr/local/src/pihole/" 2>/dev/null || true
      chmod +x "$1/usr/local/src/pihole/import_regex_deny.py"
      # Exporter beside the importer, plus the hand-run twins in ~/scripts: export-adlist.sh writes
      # timestamped CSVs to ~/pihole-adlist-backups and diffs them, import-adlist.sh adds missing
      # lists from such a CSV. The first-boot import above is unchanged.
      cp -a "$REPO_ROOT/home/scripts/pihole/export_adlists.py" "$1/usr/local/src/pihole/" 2>/dev/null || true
      chmod +x "$1/usr/local/src/pihole/export_adlists.py"
      # This is a setup hook: /usr/local/bin does not exist yet, create it before installing.
      install -d -m 0755 "$1/usr/local/bin"
      install -m 0755 "$REPO_ROOT/home/scripts/pihole/export-adlist.sh" "$1/usr/local/bin/export-adlist.sh"
      install -m 0755 "$REPO_ROOT/home/scripts/pihole/import-adlist.sh" "$1/usr/local/bin/import-adlist.sh"
      # Run-time toggle for the WPAD regex (with backups) lands in ~/scripts like the other helpers.
      install -m 0755 "$REPO_ROOT/home/scripts/pihole/wpad-block.sh" "$1/usr/local/bin/wpad-block.sh"
    - |
      # Copy local pi-hole config files from the repository.
      # These override the default installer settings.
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      PIHOLE_IPV4=${IGconf_network_ipaddress:?IGconf_network_ipaddress is required}

      install -d -m 0755 "$1/etc/pihole/"
      cp -a "$REPO_ROOT/etc/pihole/pihole.toml" "$1/etc/pihole/" 2>/dev/null || true
      # Also copy to the ke-splash location for installed reference
      install -d -m 0755 "$1/usr/local/src/pihole/"
      cp -a "$REPO_ROOT/etc/pihole/pihole.toml" "$1/usr/local/src/pihole/" 2>/dev/null || true
      # Bare pattern (not just the quoted form) so placeholders embedded
      # mid-value in longer strings resolve too.
      sed -i "s/IGconf_network_ipaddress/$PIHOLE_IPV4/g" "$1/etc/pihole/pihole.toml" "$1/usr/local/src/pihole/pihole.toml"
      chmod 0644 "$1/etc/pihole/pihole.toml"

