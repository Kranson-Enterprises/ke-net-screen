# METABEGIN
# X-Env-Layer-Name: ke-knlcfg
# X-Env-Layer-Desc: Kernel Configuration
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Category: networking
# METAEND
mmdebstrap:
  suite: trixie
  variant: minbase
  packages:
      - locales
      - rpi-eeprom      # bootloader images + rpi-eeprom-update, used by eeprom-update.sh
      - unattended-upgrades   # security-only auto-patching; policy in etc/apt/apt.conf.d/
  customize-hooks:
    - |
      # Set locale to en_US.UTF-8
      chroot "$1" locale-gen en_US.UTF-8
      chroot "$1" update-locale LANG=en_US.UTF-8
    - |
      # Tune the Kernel parameters for networking performance
      # Set swappiness to 10 instead of default 60
      # Make vm dirty pages less aggressive
      # Increase unbound socket buffer sizes for better performance
      set -eu  # Exit on error, treat unset variables as errors
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      install -d -m 0755 "$1/etc/sysctl.d"
      cp "$REPO_ROOT/etc/sysctl.d/00-swappiness.conf" "$1/etc/sysctl.d" 2>/dev/null || true
      cp "$REPO_ROOT/etc/sysctl.d/20-iodiskperf.conf" "$1/etc/sysctl.d" 2>/dev/null || true
      cp "$REPO_ROOT/etc/sysctl.d/99-unbound-tuning.conf" "$1/etc/sysctl.d" 2>/dev/null || true
    - |
      # Blacklist kernel modules unused on this wired appliance (Wi-Fi, camera,
      # unused peripheral buses; display and IPv6 untouched)
      set -eu
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      install -d -m 0755 "$1/etc/modprobe.d"
      cp "$REPO_ROOT/etc/modprobe.d/ke-appliance-blacklist.conf" "$1/etc/modprobe.d" 2>/dev/null || true
    - |
      # Reduce systemd-timesyncd clock-file writes (wear cadence ladder);
      # see comment in the drop-in itself.
      set -eu
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      install -d -m 0755 "$1/etc/systemd/timesyncd.conf.d"
      cp "$REPO_ROOT/etc/systemd/timesyncd.conf.d/ke-timesync.conf" "$1/etc/systemd/timesyncd.conf.d" 2>/dev/null || true
    - |
      # Bounded long-retention journald (14 months, weekly sealed files, 3G cap,
      # 15-min sync batches). Rationale in the drop-in; plan: journald-retention-plan.
      # Loud copy: a missing file should fail the build, not ship defaults silently.
      set -eu
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      install -d -m 0755 "$1/etc/systemd/journald.conf.d"
      install -m 0644 "$REPO_ROOT/etc/systemd/journald.conf.d/ke-journald.conf" "$1/etc/systemd/journald.conf.d/ke-journald.conf"
    - |
      # Unattended security upgrades: enable the daily pass and ship the policy
      # (security origins only, unbound blacklisted for the diversions, no
      # automatic reboot). Loud install: missing policy must fail the build.
      set -eu
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      install -d -m 0755 "$1/etc/apt/apt.conf.d"
      install -m 0644 "$REPO_ROOT/etc/apt/apt.conf.d/20auto-upgrades" "$1/etc/apt/apt.conf.d/20auto-upgrades"
      install -m 0644 "$REPO_ROOT/etc/apt/apt.conf.d/52ke-unattended-upgrades" "$1/etc/apt/apt.conf.d/52ke-unattended-upgrades"
    - |
      # Firmware config: since rpi-image-gen v2.9.0 BOTH boot files are assembled from
      # per-layer fragments in late hooks (cmdline at v2.8.0-88, config.txt at v2.9.0),
      # so nothing is copied here — a copied file would be overwritten. Our settings live
      # as static drop-ins under layer/ke-03-knlcfg.d/for/:
      #   linux-base/cmdline.d/60-ke-appliance                (kernel command line)
      #   rpi-boot-firmware/config.txt.d/{10-rpi-audio,20-rpi-camera,30-rpi-display,
      #     63-rpi-pi5,50-ke-appliance}  (same-name fragments REPLACE the stock ones
      #     in place; 50-ke-appliance appends the wireless-off overlays etc.)
      true
    - |
      # Bootloader EEPROM helper (~/scripts/eeprom-update.sh): shows the installed bootloader
      # against the channel's latest and stages an update only on request. The boot-time
      # rpi-eeprom-update -s -a applies critical minimums only, so this is how the appliance
      # catches up with what the shipped rpi-eeprom package already carries.
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      install -d -m 0755 "$1/usr/local/bin"
      install -m 0755 "$REPO_ROOT/home/scripts/firmware/eeprom-update.sh" "$1/usr/local/bin/eeprom-update.sh"
