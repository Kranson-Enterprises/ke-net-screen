# METABEGIN
# X-Env-Layer-Name: ke-knlcfg
# X-Env-Layer-Desc: Kernel Configuration
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Category: networking
# METAEND
mmdebstrap:
  suite: trixie
  variant: minbase
  packages:
      - locales
  customize-hooks:
    - |
      # Set locale to en_US.UTF-8
      chroot "$1" locale-gen en_US.UTF-8
      chroot "$1" update-locale LANG=en_US.UTF-8
    - |
      # Tune the Kernel parameters for networking performance
      # Set swappiness to 10 instead of default 60
      # Make vm dirty pages less aggressive
      # Increase unbound socket buffer sizes for better performance
      set -eu  # Exit on error, treat unset variables as errors
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      install -d -m 0755 "$1/etc/sysctl.d"
      cp "$REPO_ROOT/etc/sysctl.d/00-swappiness.conf" "$1/etc/sysctl.d" 2>/dev/null || true
      cp "$REPO_ROOT/etc/sysctl.d/20-iodiskperf.conf" "$1/etc/sysctl.d" 2>/dev/null || true
      cp "$REPO_ROOT/etc/sysctl.d/99-unbound-tuning.conf" "$1/etc/sysctl.d" 2>/dev/null || true
    - |
      # Blacklist kernel modules unused on this wired appliance (Wi-Fi, camera,
      # unused peripheral buses; display and IPv6 untouched)
      set -eu
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      install -d -m 0755 "$1/etc/modprobe.d"
      cp "$REPO_ROOT/etc/modprobe.d/ke-appliance-blacklist.conf" "$1/etc/modprobe.d" 2>/dev/null || true
    - |
      # Mask systemd's TPM 2.0 / PCR measurement units. The Pi 5 has no TPM and
      # does not boot a measured UKI, so every one of these is already skipped at
      # boot on ConditionSecurity=measured-uki; masking drops the seven "skipped,
      # unmet condition" journal lines and guarantees they never start even if a
      # later systemd relaxes the condition. Masking = symlink to /dev/null in
      # /etc/systemd/system, which overrides the unit in /usr/lib/systemd/system.
      # Undo on a device: systemctl unmask <unit>.
      set -eu
      install -d -m 0755 "$1/etc/systemd/system"
      for unit in \
          systemd-tpm2-setup-early.service \
          systemd-tpm2-setup.service \
          systemd-pcrmachine.service \
          systemd-pcrphase-sysinit.service \
          systemd-pcrphase.service \
          systemd-pcrextend.socket \
          systemd-pcrlock.socket; do
          ln -sf /dev/null "$1/etc/systemd/system/$unit"
      done
    - |
      # Reduce systemd-timesyncd clock-file writes (wear cadence ladder);
      # see comment in the drop-in itself.
      set -eu
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      install -d -m 0755 "$1/etc/systemd/timesyncd.conf.d"
      cp "$REPO_ROOT/etc/systemd/timesyncd.conf.d/ke-timesync.conf" "$1/etc/systemd/timesyncd.conf.d" 2>/dev/null || true
    - |
      # Tune the boot parameters for minimal resource usage
      # Disable bluetooth and other services not needed for headless servers
      REPO_ROOT=${SRCROOT:?SRCROOT is required}
      cp "$REPO_ROOT/boot/firmware/config.txt" "$1/boot/firmware" 2>/dev/null || true
      cp "$REPO_ROOT/boot/firmware/cmdline.txt" "$1/boot/firmware" 2>/dev/null || true
