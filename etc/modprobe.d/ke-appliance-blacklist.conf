# Modules with no role on this wired DNS appliance (display kept, Wi-Fi and
# camera removed). Verified unloadable (refcount 0, no holders) on a running
# Pi 5 build.
#
# Deliberately NOT blacklisted:
#   vc4/v3d/snd_soc_hdmi_codec - display stack stays enabled
#   i2c_brcmstb       - DSI display / touch controllers sit on I2C
#   pwm_fan           - thermal subsystem drives the active cooler through it
#   gpio_keys         - Pi 5 power button (clean shutdown)
#   raspberrypi_hwmon - under-voltage detection via sysfs
#   aes_ce_blk/ghash_ce - crypto accel, needed if WireGuard/dm-crypt is ever added
#   IPv6/netfilter    - untouched; IPv6 compatibility is required

# Wi-Fi core (radio already disabled via dtoverlay=disable-wifi)
blacklist cfg80211

# Camera pipeline (camera disabled via dtoverlay=disable-camera)
blacklist pisp_be

# HEVC hardware video decode (display shows UI, doesn't play video)
blacklist rpi_hevc_dec

# Unused peripheral buses and userspace hardware access
blacklist spidev
blacklist spi_bcm2835
blacklist rp1_adc
blacklist rp1_pio
blacklist raspberrypi_gpiomem

# Input devices and misc
blacklist joydev
blacklist nvmem_rmem
