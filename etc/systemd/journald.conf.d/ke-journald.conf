# ke-journald.conf — bounded, long-retention journald for an unmonitored appliance.
# Installed by layer/ke-03-knlcfg.yaml. Rationale and sizing: an always-on DNS box
# writing ~6 MB/day of journal should keep ~14 months of history, seal the active
# file often (small corruption window on power cuts; age pruning only removes
# sealed files), never outgrow a fixed budget, and batch writes to spare the SD.
# CRIT and above still sync immediately regardless of SyncIntervalSec.
[Journal]
SystemMaxUse=3G
SystemKeepFree=2G
SystemMaxFileSize=32M
MaxFileSec=1week
MaxRetentionSec=14month
SyncIntervalSec=15min
