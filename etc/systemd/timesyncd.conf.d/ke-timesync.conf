# ke-timesync.conf — clock discipline belongs to timesyncd alone (FTL's own NTP
# client is disabled in pihole.toml; FTL serves LAN time from the system clock).
#
# Servers: names first, then IP literals IN THE SAME NTP= LIST. This host's
# resolver IS the Pi-hole stack, so in the first seconds of every boot, on first
# boot before FTL exists, or during a resolver outage the names cannot resolve.
# timesyncd walks NTP= in order and moves to the next entry when a name fails, so
# it syncs from a literal instead of waiting ~32 s to retry the names (measured on
# every boot, first and warm, while the literals sat only in FallbackNTP=).
# Literals: Google Public NTP (time.google.com anycast, stratum 1; Google smears
# leap seconds, none are scheduled).
#
# FallbackNTP= is NOT a resolver-outage fallback: timesyncd uses it only when no
# NTP= or per-link servers are configured at all (timesyncd.conf(5)). Kept as a
# last-resort list (Cloudflare time anycast) should NTP= ever be emptied.
#
# SaveIntervalSec: persist the current time to disk every 10 min instead of the
# default 60 s (~1,440 tiny SD writes/day). The Pi 5 has an RTC for boot-time
# plausibility; the on-disk timestamp is only a fallback. 600 s also lands on
# the image's write-cadence ladder (30 s ext4 commit | 600 s FTL DBinterval).
[Time]
NTP=2.debian.pool.ntp.org time.google.com 216.239.35.0 216.239.35.4
FallbackNTP=162.159.200.1 162.159.200.123
SaveIntervalSec=600
