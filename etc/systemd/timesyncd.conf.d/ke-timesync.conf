# Persist the current time to /var/lib/systemd/timesync/clock every 10 min
# instead of the default 60 s (~1,440 tiny SD writes/day). The Pi 5 has a
# real RTC for boot-time plausibility, so the on-disk timestamp is only a
# fallback; 600 s also lands on the image's write-cadence ladder
# (5 s flusher | 30 s dirty-expire = 30 s ext4 commit | 600 s FTL DBinterval).
[Time]
SaveIntervalSec=600
