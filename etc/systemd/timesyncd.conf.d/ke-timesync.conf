# ke-timesync.conf — clock discipline belongs to timesyncd alone (FTL's own NTP
# client is disabled in pihole.toml; FTL serves LAN time from the system clock).
#
# Servers: explicit names first; the IP-literal fallbacks matter because this
# host's resolver IS the Pi-hole stack — before FTL is up (first ~30 s of boot)
# or while it is down, pool names cannot resolve and sync would stall. With
# literals, time sync works even during a resolver outage.
# (Fallbacks: Google time + Cloudflare time anycast addresses.)
#
# SaveIntervalSec: persist the current time to disk every 10 min instead of the
# default 60 s (~1,440 tiny SD writes/day). The Pi 5 has an RTC for boot-time
# plausibility; the on-disk timestamp is only a fallback. 600 s also lands on
# the image's write-cadence ladder (30 s ext4 commit | 600 s FTL DBinterval).
[Time]
NTP=2.debian.pool.ntp.org time.google.com
FallbackNTP=216.239.35.0 216.239.35.4 162.159.200.1 162.159.200.123
SaveIntervalSec=600
