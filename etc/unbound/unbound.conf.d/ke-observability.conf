# ke-observability.conf — persistent resolver observability. These were trialed
# via `unbound-control set_option` and the lesson is recorded: set_option does
# not survive a restart, and the statistics timer only arms at startup, so the
# interval can ONLY come from config. Shipped here so both survive reboots and
# rebuilds.
#
#   statistics-interval    one "server stats for thread N" journal block per
#                          hour (queries, cache hits, recursions, requestlist);
#                          parsed by collect-appliance-logs.sh --review-journal.
#   statistics-cumulative  no = per-interval deltas (directly comparable hour
#                          to hour, the shape the collector expects).
#   val-log-level 1        log each DNSSEC validation failure with the domain
#                          (proved out 2026-10: caught a real upstream zone
#                          glitch and resolver-test probes).
#
# Cost: ~1 KB/h of journal inside the 14-month retention budget. No resolution
# behaviour changes.
server:
    statistics-interval: 3600
    statistics-cumulative: no
    val-log-level: 1
