server:
    # If no logfile is specified, syslog is used
    # logfile: "/var/log/unbound/unbound.log"
    verbosity: 0
    # Reply-time histograms plus per-qtype/rcode counters in
    # unbound-control stats output (negligible cost; counters only).
    extended-statistics: yes
    chroot: ""
    module-config: "dns64 validator iterator"
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    # Hold idle client TCP connections 120s (max) instead of 30s. FTL's
    # dnsmasq reuses its upstream TCP socket without keepalive awareness, so
    # every idle-close races its next reuse and logs "Connection prematurely
    # closed by remote server" (harmless - FTL retries - but noisy). Safe at
    # 4x hold time: our only TCP client is FTL on loopback, so the default
    # 10 incoming-num-tcp slots cannot be contended.
    tcp-idle-timeout: 120000
    # dns64 helps create avahi connections
    do-ip6: yes
    prefer-ip6: no
    #root-hints: "/var/lib/unbound/root.hints"
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    edns-buffer-size: 1232
    prefetch: yes
    # Prefetch DNSKEY/DS during validation instead of serially.
    prefetch-key: yes
    num-threads: 1
    msg-cache-size: 16m
    rrset-cache-size: 16m
    # Single thread: one slab per cache avoids pointless lock partitioning.
    msg-cache-slabs: 1
    rrset-cache-slabs: 1
    infra-cache-slabs: 1
    key-cache-slabs: 1
    cache-min-ttl: 60
    cache-max-ttl: 86400

    # Serve stale (RFC 8767) as a resilience fallback: if resolution takes
    # longer than 1.8s (slow or dead upstream), answer from stale cache
    # instead, up to a day past expiry. Instant stale-while-revalidate for
    # recently expired records already happens a layer up in FTL
    # (dns.cache.optimizer = 3600); unbound's job here is keeping answers
    # flowing when the WAN is degraded.
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800
    # During an outage longer than a day, keep serving whatever we have:
    # each time a stale record is served its expiry timer is reset.
    serve-expired-ttl-reset: yes
    # Keep probing unreachable upstreams while serving stale so recovery
    # is noticed promptly instead of waiting out the infra-cache backoff.
    # infra-keep-probing: yes
    # Socket buffer sizes require kernel tuning to take effect.
    so-rcvbuf: 8m
    so-sndbuf: 8m

    ratelimit: 5000
    discard-timeout: 0
    wait-limit: 2000
    ip-ratelimit: 0

    # Rebinding/privacy protection for local and special-use ranges
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 100.64.0.0/10
    private-address: 127.0.0.0/8
    private-address: 198.18.0.0/15
    private-address: 0.0.0.0/8
    private-address: 255.255.255.255/32

    private-address: ::1/128
    private-address: fc00::/7
    private-address: fe80::/10
    private-address: 2001:db8::/32

    # Documentation ranges
    private-address: 192.0.2.0/24
    private-address: 198.51.100.0/24
    private-address: 203.0.113.0/24

    # RFC6303-style reverse leakage protection
    local-zone: "10.in-addr.arpa." static
    local-zone: "16.172.in-addr.arpa." static
    local-zone: "17.172.in-addr.arpa." static
    local-zone: "18.172.in-addr.arpa." static
