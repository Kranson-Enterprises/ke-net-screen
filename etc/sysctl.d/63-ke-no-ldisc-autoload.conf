# 63-ke-no-ldisc-autoload.conf  —  OPTIONAL: no tty line-discipline module autoload
#
# Installed only when SYSCTL_NO_LDISC_AUTOLOAD=y in .env (default n: not shipped, kernel
# default 1 applies). Any user who can open a tty can ask for a line discipline (TIOCSETD),
# and the kernel then loads its module on demand; past local-root bugs (n_hdlc, n_gsm,
# slcan) were reached exactly that way. 0 means only CAP_SYS_MODULE can trigger the load.
# The serial console (ttyAMA10) and SSH use the built-in N_TTY discipline and are
# unaffected.
# Reversible on a running appliance: delete this file, then
#   sudo sysctl -w dev.tty.ldisc_autoload=1      (sysctl --system does not reset it)
# Verify:  cat /proc/sys/dev/tty/ldisc_autoload   -> 0
dev.tty.ldisc_autoload = 0
