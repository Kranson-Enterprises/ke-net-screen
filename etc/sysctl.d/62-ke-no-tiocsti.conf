# 62-ke-no-tiocsti.conf  —  OPTIONAL: no keystroke injection into other terminals
#
# Installed only when SYSCTL_NO_TIOCSTI=y in .env (default n: not shipped, kernel default
# 1 applies). The TIOCSTI ioctl pushes characters into a terminal's input queue as if
# typed; a process sharing a terminal with a privileged shell (e.g. something started
# from an admin's session before `sudo -i`) can use it to run commands as that shell.
# 0 restricts it to CAP_SYS_ADMIN. Nothing on the appliance needs it; the rare tools that
# do (some console screen readers, `writevt`) do not run here.
# Reversible on a running appliance: delete this file, then
#   sudo sysctl -w dev.tty.legacy_tiocsti=1      (sysctl --system does not reset it)
# Verify:  cat /proc/sys/dev/tty/legacy_tiocsti   -> 0
dev.tty.legacy_tiocsti = 0
