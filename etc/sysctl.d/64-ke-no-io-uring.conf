# 64-ke-no-io-uring.conf  —  OPTIONAL: io_uring off for every process
#
# Installed only when SYSCTL_NO_IO_URING=y in .env (default n: not shipped, kernel default
# 0 applies). io_uring is a large, fast-moving kernel interface and a recurring source of
# local privilege-escalation bugs. 2 makes io_uring_setup() fail with EPERM for everyone,
# root included. Nothing on the appliance depends on it: Pi-hole FTL, unbound, stunnel and
# systemd do not use it, and libuv (dig, bind9 libraries) falls back to its thread pool
# when it is refused. Software installed later that requires io_uring will fail; turn
# this off (or use 1 plus kernel.io_uring_group) for it.
# Reversible on a running appliance: delete this file, then
#   sudo sysctl -w kernel.io_uring_disabled=0    (sysctl --system does not reset it)
# Verify:  cat /proc/sys/kernel/io_uring_disabled   -> 2
kernel.io_uring_disabled = 2
