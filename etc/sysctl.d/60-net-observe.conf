# 60-net-observe.conf  —  OPTIONAL network observability / anti-spoof hardening
#
# Low-cost kernel settings that clarify security posture: log spoofed ("martian")
# packets, drop reverse-path-failing/spoofed traffic, and refuse ICMP redirects.
# Reversible: delete this file (or rename to 60-net-observe.conf.disabled) and run
#   sudo sysctl --system   (or reboot). Nothing here is enabled unless this file is
# present, so it is safe to add during the test week and remove before merge if unwanted.
#
# Command-line equivalents (apply immediately, no reboot):
#   sudo sysctl -w net.ipv4.conf.all.log_martians=1
#   sudo sysctl -w net.ipv4.conf.default.log_martians=1
#   sudo sysctl -w net.ipv4.conf.all.rp_filter=1
#   sudo sysctl -w net.ipv4.conf.default.rp_filter=1
#   sudo sysctl -w net.ipv4.conf.all.accept_redirects=0
#   sudo sysctl -w net.ipv4.conf.default.accept_redirects=0
#   sudo sysctl -w net.ipv4.conf.all.secure_redirects=0
#   sudo sysctl -w net.ipv4.conf.default.secure_redirects=0
#   sudo sysctl -w net.ipv4.conf.all.send_redirects=0
#   sudo sysctl -w net.ipv4.conf.default.send_redirects=0
# Apply this whole file:  sudo sysctl --system
# Verify:                 sysctl net.ipv4.conf.all.{log_martians,rp_filter,accept_redirects}
# Watch the signal:       journalctl -k -f | grep -i martian

# --- Log martian packets (impossible/spoofed source) -> kernel log / journalctl -k ---
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# --- Reverse-path filter (drop spoofed/asymmetric source). strict(1) is safe on a
#     single-homed appliance; use 2 (loose) only if you ever multi-home it. ---
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# --- ICMP redirects: don't accept (route-injection / MITM vector); don't send
#     (this host is not a router). ---
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# --- Source routing: refuse (already default; set explicitly). ---
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# --- IPv6 (disabled on this appliance; harmless if off, protective if ever enabled). ---
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
# net.ipv6.conf.all.accept_ra = 0   # uncomment to refuse IPv6 router advertisements

# --- conntrack flow visibility: ONLY effective if a firewall has loaded nf_conntrack.
#     Left commented because this appliance has no netfilter firewall by default. ---
# net.netfilter.nf_conntrack_acct = 1           # per-flow byte/packet counters
# net.netfilter.nf_conntrack_timestamp = 1      # per-flow start/stop timestamps
# net.netfilter.nf_conntrack_log_invalid = 255  # log invalid/out-of-state packets (noisy)
