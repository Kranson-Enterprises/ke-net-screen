# 61-kernel-harden.conf  —  OPTIONAL kernel information-exposure hardening
#
# Installed together with 60-net-observe.conf only when SYSCTL_HARDENING=y in .env
# (default n: neither file ships and kernel/distro defaults apply).
# Reversible on a running appliance: delete the file and run  sudo sysctl --system
#
# --- Hide kernel addresses in /proc/kallsyms, /proc/modules etc. from non-root ---
kernel.kptr_restrict = 1

# --- Kernel log readable by root only. `dmesg` then needs sudo; the journal's kernel
#     stream (journalctl -k) stays readable for members of group adm, and the
#     appliance's own services (health check, maintenance) run as root. ---
kernel.dmesg_restrict = 1
