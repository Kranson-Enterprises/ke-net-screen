AddressFamily inet
ListenAddress IGconf_network_ipaddress

# Authentication hardening
PermitRootLogin no
PasswordAuthentication yes
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
GSSAPIAuthentication no
# PubkeyAuthentication yes
# AuthenticationMethods publickey
UsePAM yes

HostKey /etc/ssh/ssh_host_ed25519_key

# Transport hardening. Only the SET matters: SSH uses the first entry of the CLIENT's
# list that the server also allows (RFC 4253 section 7.1), so the order below is for
# reading, not preference. Nothing weak is allowed (no CBC, SHA-1, MD5, legacy DH).
# Key exchange:
#   mlkem768x25519-sha256        ML-KEM-768 (FIPS 203) + X25519 post-quantum hybrid,
#                                OpenSSH 10's default
#   sntrup761x25519-sha512       Streamlined NTRU Prime + X25519 hybrid, both spellings:
#                                older OpenSSH clients know only the @openssh.com one
#   curve25519-sha256            X25519 for clients without a PQ hybrid: phone apps, and
#                                Windows' bundled OpenSSH (OpenSSH_for_Windows 9.5 offers
#                                neither hybrid)
#   ecdh-sha2-nistp521/384/256   NIST curves, the FIPS-approved key agreement
# Ciphers: ChaCha20-Poly1305 and AES-GCM (AEAD), AES-CTR (FIPS) with an ETM MAC.
# MACs (only used with CTR; AEAD ciphers carry their own): HMAC-SHA2 (FIPS), UMAC-128;
# encrypt-then-MAC only.
# Check before reloading sshd: sudo sshd -t   (a mistyped name stops sshd; the image
#   build runs the same check). From a client: ssh -vv ... 2>&1 | grep 'kex: algorithm'
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com